div><div id="regSuccess" style="display:none" class="success"></div></div></div></section></main>`);regBtn.onclick=()=>{if(e.registration_method==='external'&&e.external_form_url){open(e.external_form_url,'_blank');return}regSection.style.display='block';regSection.scrollIntoView({behavior:'smooth'})};regForm.onsubmit=async z=>{z.preventDefault();let o=Object.fromEntries(new FormData(regForm));if(!email(o.email))return toast('Please enter a valid email address.');if(!phone(o.phone))return toast('Please enter a valid phone number.');let{data,error}=await sb.rpc('register_for_event_v2',{p_event_id:e.id,p_data:o,p_marketing_consent:false});if(error)return toast(error.message);regPane.style.display='none';regSuccess.style.display='block';regSuccess.innerHTML=`<div class="checkmark">✓</div><h2>You’re registered.</h2><p>Thank you, ${E(o.full_name)}. Your place for ${E(e.title)} is confirmed.</p><p><a class="btn outline" target="_blank" href="${cal(e)}">Add to Google Calendar</a>${data?.community_url?` <a class="btn" target="_blank" href="${E(data.community_url)}">${E(data.community_label||'Join event community')}</a>`:''}</p>`}}async function tell(){mount(H('story')+`<main><section class="pink"><div class="shell page-hero"><p class="kicker">YOUR STORY MATTERS</p><h1>Tell your story.</h1><p>Share a learning moment, career pivot, project lesson or perspective that could help someone else.</p></div></section><section class="section pink"><div class="shell panel" style="width:min(820px,92vw)"><form id="storyForm" class="form"><div class="field"><label>Full name *</label><input name="full_name" required></div><div class="field"><label>Email *</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Story title</label><input name="story_title"></div><div class="field full"><label>Tell us about your story *</label><textarea name="story_summary" rows="7" required></textarea></div><div class="field full"><label>About you</label><textarea name="background" rows="4"></textarea></div><div class="field full"><button class="btn">Submit story</button></div></form><div id="storySuccess" style="display:none" class="success"><div class="checkmark">✓</div><h2>Your story is with us.</h2><p>The Next Gen Plex team will review your submission and contact you if we would like to develop it for publication.</p></div></div></section></main>`);storyForm.onsubmit=async z=>{z.preventDefault();let o=Object.fromEntries(new FormData(storyForm));if(!email(o.email))return toast('Please enter a valid email address.');let{error}=await sb.rpc('submit_story_v2',{p_data:o});if(error)return toast(error.message);storyForm.style.display='none';storySuccess.style.display='block'}}async function favorites(){let a=JSON.parse(localStorage.getItem('nexus_favorites')||'[]');mount(H('favorites')+`<main><section class="butter"><div class="shell page-hero"><p class="kicker">YOUR SAVED ITEMS</p><h1>Favorites</h1><p>Saved on this device. No account required.</p></div></section><section class="section white"><div class="shell grid">${a.map(x=>card(x)).join('')||'<p>Nothing saved yet.</p>'}</div></section></main>`)}async function about(){let{data:s}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();mount(H('about')+`<main><section class="mint"><div class="shell page-hero"><p class="kicker">ABOUT NEXUS</p><h1>Construction without borders.</h1><p>${E(s?.about_text||'NEXUS helps emerging construction professionals understand international workflows, discover career paths, hear real stories and build direction before deciding what to master.')}</p></div></section><section class="section white"><div class="shell experience"><div class="exp butter"><small>01</small><h3>Understand the industry.</h3><span>Learn how projects and roles connect.</span></div><div class="exp lav"><small>02</small><h3>See what is possible.</h3><span>Explore global career pathways.</span></div><div class="exp pink"><small>03</small><h3>Build the right direction.</h3><span>Choose skills based on the role, not hype.</span></div><div class="exp mint"><small>04</small><h3>Grow through community.</h3><span>Learn with people on the same journey.</span></div></div></section></main>`)}async function contact(){mount(H('contact')+`<main><section class="sky"><div class="shell page-hero"><p class="kicker">CONTACT</p><h1>Talk to NEXUS.</h1><p>Questions, partnerships, universities and community ideas are welcome.</p></div></section><section class="section white"><div class="shell panel" style="width:min(760px,92vw)"><form id="contactForm" class="form"><div class="field"><label>Name *</label><input name="full_name" required></div><div class="field"><label>Email *</label><input type="email" name="email" required></div><div class="field full"><label>Subject</label><input name="subject"></div><div class="field full"><label>Message *</label><textarea name="message" rows="6" required></textarea></div><div class="field full"><button class="btn">Send message</button></div></form></div></section></main>`);contactForm.onsubmit=async z=>{z.preventDefault();let o=Object.fromEntries(new FormData(contactForm)),{error}=await sb.rpc('submit_contact',{p_data:o});if(error)return toast(error.message);contactForm.innerHTML='<div class="success"><div class="checkmark">✓</div><h2>Message received.</h2><p>Thank you for reaching out.</p></div>'}}function route(){let p=location.pathname.replace(/\/$/,'')||'/';if(p==='/')return home();if(p==='/episodes')return stories('episode');if(p==='/stories')return stories('story');if(p==='/gallery'||p==='/library')return gallery();if(p==='/events')return events();if(p==='/event')return event();if(p==='/story')return story();if(p==='/tell-your-story'||p==='/tell-story')return tell();if(p==='/favorites')return favorites();if(p==='/about')return about();if(p==='/contact')return contact();if(p==='/admin'){location.href='/admin.html';return}mount(H()+`<main class="article"><h1>Page not found</h1></main>`)}document.addEventListener('click',e=>{let a=e.target.closest('a');if(a&&a.origin===location.origin&&!a.target){e.preventDefault();history.pushState({},'',a.pathname+a.search+a.hash);route();if(a.hash)setTimeout(()=>document.querySelector(a.hash)?.scrollIntoView({behavior:'smooth'}),100)}});onpopstate=route;document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));c.classList.add('active');joinForm.style.display='grid';joinForm.pathway.value=c.dataset.path});joinForm.onsubmit=async z=>{z.preventDefault();let o=Object.fromEntries(new FormData(joinForm));if(!email(o.email)||!phone(o.phone))return toast('Please enter a valid email and phone number.');let{error}=await sb.rpc('join_nexus',{p_data:o});if(error)return toast(error.message);joinForm.style.display='none';joinSuccess.style.display='block'};route();
</script></body></html>

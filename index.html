<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — Construction Without Borders</title>
<meta name="description" content="NEXUS connects emerging construction professionals with stories, episodes, events and global construction workflows.">
<link rel="stylesheet" href="/site.css">
<script>(()=>{const q=location.search||'',h=location.hash||'';const a=/type=(recovery|invite)/.test(q+h)||/[?&]code=/.test(q)||/access_token=/.test(h);if(a){location.replace('/admin-reset'+q+h)}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div><div id="joinModal" class="modal"><div class="modal-card"><button class="close" onclick="closeJoin()">×</button><p class="kicker">JOIN NEXUS</p><h2 id="joinModalTitle" class="display" style="font-size:42px">Join NEXUS</h2><p id="joinModalIntro">Choose how you would like to connect with the NEXUS community.</p><div class="choices"><button class="choice" data-path="ambassador"><b>Become an Ambassador</b><p>Represent NEXUS in your university, city or professional circle.</p></button><button class="choice" data-path="partner"><b>Become a Partner</b><p>Collaborate through a university, society, company or network.</p></button></div><form id="joinForm" class="form" style="margin-top:18px;display:none"><input type="hidden" name="pathway"><div class="field"><label>Full name *</label><input name="full_name" required></div><div class="field"><label>Email *</label><input type="email" name="email" required></div><div class="field"><label>Phone / WhatsApp *</label><input name="phone" required></div><div class="field"><label>Occupation</label><select name="occupation"><option value="">Select</option><option>Student</option><option>Fresh Graduate</option><option>Working Professional</option><option>Faculty</option><option>Organization Representative</option><option>Other</option></select></div><div class="field full"><label>University / Company / Organization</label><input name="university_or_company"></div><div class="field"><label>City</label><input name="city"></div><div class="field full"><label>Why would you like to join?</label><textarea name="reason" rows="3"></textarea></div><div class="field full"><button class="btn">Submit</button></div></form><div id="joinSuccess" class="success" style="display:none"><div class="check">✓</div><h3>Thank you for joining NEXUS.</h3><p>We have received your details.</p></div></div></div>

<script src="/app.js" defer></script>
<script src="/public-cms.js" defer></script>
</body>
</html>

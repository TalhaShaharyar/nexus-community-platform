<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS</title><script>(async()=>{try{const ps=['/payload/part01.txt','/payload/part02.txt','/payload/part03.txt','/payload/part04.txt','/payload/part05.txt','/payload/part06.txt','/payload/part07.txt'],cs=await Promise.all(ps.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(p+': '+r.status);return r.text()}))),b=atob(cs.join('')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);const s=new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip')),h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<pre style="padding:20px;font-family:monospace">NEXUS failed to load: '+String(e)+'</pre>'}}})()</script>
